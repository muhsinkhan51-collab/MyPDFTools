<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word to PDF - MyPDFTools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            background: #f8fafc;
        }

        .upload-area input {
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #convertBtn {
            background: #2563eb;
            color: white;
        }

        #clearBtn {
            background: #64748b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        /* Hidden Word document rendering area */
        #renderArea {
            position: absolute;
            left: -10000px;
            top: 0;
            width: 794px;
            background: white;
            padding: 60px;
            color: #000;
            font-family: Arial, sans-serif;
        }

        #renderArea img {
            max-width: 100%;
            height: auto;
        }

        #renderArea table {
            border-collapse: collapse;
            width: 100%;
        }

        #renderArea table,
        #renderArea th,
        #renderArea td {
            border: 1px solid #555;
        }

        #renderArea th,
        #renderArea td {
            padding: 6px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Word to PDF</h1>
        <p>Convert Word documents into PDF files</p>
    </div>

    <div class="container">

        <div class="card">

            <div class="upload-area">

                <h2>Select Word File</h2>

                <p>
                    Choose a Microsoft Word DOCX file.
                </p>

                <input
                    type="file"
                    id="wordFile"
                    accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                >

            </div>

            <div class="buttons">

                <button id="convertBtn">
                    Convert to PDF
                </button>

                <button id="clearBtn">
                    Clear
                </button>

            </div>

            <div id="status"></div>

            <a href="index.html" class="back">
                ← Back to MyPDFTools
            </a>

        </div>

    </div>


    <!-- Hidden area used to render the Word document -->
    <div id="renderArea"></div>


    <!-- Mammoth.js -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>

    <!-- html2canvas -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>


    <script>

        const wordFile =
            document.getElementById("wordFile");

        const convertBtn =
            document.getElementById("convertBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const status =
            document.getElementById("status");

        const renderArea =
            document.getElementById("renderArea");


        convertBtn.addEventListener(
            "click",
            async function () {

                if (!wordFile.files.length) {

                    status.textContent =
                        "Please select a Word document.";

                    return;
                }


                try {

                    convertBtn.disabled = true;

                    status.textContent =
                        "Reading Word document...";


                    const file =
                        wordFile.files[0];


                    const arrayBuffer =
                        await file.arrayBuffer();


                    /*
                     * Convert DOCX to HTML
                     */

                    const result =
                        await mammoth.convertToHtml({
                            arrayBuffer: arrayBuffer
                        });


                    /*
                     * Put converted document
                     * into the hidden rendering area.
                     */

                    renderArea.innerHTML =
                        result.value;


                    /*
                     * Basic document formatting.
                     */

                    const paragraphs =
                        renderArea.querySelectorAll("p");


                    paragraphs.forEach(
                        paragraph => {

                            paragraph.style.marginBottom =
                                "10px";

                            paragraph.style.lineHeight =
                                "1.5";

                        }
                    );


                    const headings =
                        renderArea.querySelectorAll(
                            "h1, h2, h3, h4, h5, h6"
                        );


                    headings.forEach(
                        heading => {

                            heading.style.marginTop =
                                "18px";

                            heading.style.marginBottom =
                                "10px";

                        }
                    );


                    /*
                     * Wait for images and document
                     * content to be ready.
                     */

                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 500)
                    );


                    status.textContent =
                        "Preparing PDF...";


                    /*
                     * Render Word document as an image.
                     */

                    const canvas =
                        await html2canvas(
                            renderArea,
                            {
                                scale: 2,
                                useCORS: true,
                                backgroundColor: "#ffffff"
                            }
                        );


                    const imageData =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.95
                        );


                    /*
                     * Create A4 PDF.
                     */

                    const {
                        jsPDF
                    } = window.jspdf;


                    const pdf =
                        new jsPDF({
                            orientation: "portrait",
                            unit: "mm",
                            format: "a4"
                        });


                    const pageWidth =
                        210;

                    const pageHeight =
                        297;

                    const margin =
                        10;

                    const usableWidth =
                        pageWidth - margin * 2;


                    /*
                     * Calculate image height
                     * while maintaining aspect ratio.
                     */

                    const imageWidth =
                        usableWidth;

                    const imageHeight =
                        canvas.height *
                        imageWidth /
                        canvas.width;


                    let heightLeft =
                        imageHeight;

                    let position =
                        margin;


                    /*
                     * Add the first page.
                     */

                    pdf.addImage(
                        imageData,
                        "JPEG",
                        margin,
                        position,
                        imageWidth,
                        imageHeight
                    );


                    heightLeft -=
                        pageHeight -
                        margin * 2;


                    /*
                     * Add additional pages.
                     */

                    while (heightLeft > 0) {

                        position =
                            heightLeft -
                            imageHeight +
                            margin;

                        pdf.addPage();

                        pdf.addImage(
                            imageData,
                            "JPEG",
                            margin,
                            position,
                            imageWidth,
                            imageHeight
                        );

                        heightLeft -=
                            pageHeight -
                            margin * 2;

                    }


                    /*
                     * Download PDF.
                     */

                    pdf.save(
                        "word-to-pdf.pdf"
                    );


                    status.textContent =
                        "Word document converted to PDF successfully!";


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error converting Word document. Please try again.";

                } finally {

                    convertBtn.disabled = false;

                }

            }
        );


        clearBtn.addEventListener(
            "click",
            function () {

                wordFile.value = "";

                renderArea.innerHTML = "";

                status.textContent = "";

            }
        );

    </script>

</body>
</html>
