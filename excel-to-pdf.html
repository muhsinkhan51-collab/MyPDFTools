<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to PDF - MyPDFTools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            background: #f8fafc;
        }

        .upload-area input {
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #convertBtn {
            background: #2563eb;
            color: white;
        }

        #clearBtn {
            background: #64748b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Excel to PDF</h1>
        <p>Convert Excel spreadsheets into PDF documents</p>
    </div>

    <div class="container">
        <div class="card">

            <div class="upload-area">
                <h2>Select Excel File</h2>
                <p>
                    Supported formats:
                    XLS, XLSX, XLSM, XLTX, XLTM, XLSB and CSV
                </p>

                <input
                    type="file"
                    id="excelFile"
                    accept=".xls,.xlsx,.xlsm,.xltx,.xltm,.xlsb,.csv"
                >
            </div>

            <div class="buttons">
                <button id="convertBtn">
                    Convert to PDF
                </button>

                <button id="clearBtn">
                    Clear
                </button>
            </div>

            <div id="status"></div>

            <a href="index.html" class="back">
                ← Back to MyPDFTools
            </a>

        </div>
    </div>

    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- jsPDF AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

    <script>

        const excelFile =
            document.getElementById("excelFile");

        const convertBtn =
            document.getElementById("convertBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const status =
            document.getElementById("status");


        convertBtn.addEventListener(
            "click",
            async function () {

                if (!excelFile.files.length) {

                    status.textContent =
                        "Please select an Excel file.";

                    return;
                }

                try {

                    status.textContent =
                        "Converting Excel file...";

                    const file =
                        excelFile.files[0];

                    const arrayBuffer =
                        await file.arrayBuffer();

                    const workbook =
                        XLSX.read(arrayBuffer, {
                            type: "array"
                        });

                    const {
                        jsPDF
                    } = window.jspdf;

                    const pdf =
                        new jsPDF({
                            orientation: "landscape",
                            unit: "pt",
                            format: "a4"
                        });


                    workbook.SheetNames.forEach(
                        (sheetName, sheetIndex) => {

                            if (sheetIndex > 0) {
                                pdf.addPage();
                            }

                            const worksheet =
                                workbook.Sheets[sheetName];

                            const data =
                                XLSX.utils.sheet_to_json(
                                    worksheet,
                                    {
                                        header: 1,
                                        defval: ""
                                    }
                                );

                            if (!data.length) {
                                return;
                            }

                            pdf.setFontSize(14);

                            pdf.text(
                                sheetName,
                                40,
                                30
                            );

                            pdf.autoTable({
                                head: [
                                    data[0]
                                ],

                                body:
                                    data.slice(1),

                                startY: 45,

                                margin: {
                                    left: 30,
                                    right: 30
                                },

                                styles: {
                                    fontSize: 7,
                                    cellPadding: 4,
                                    overflow: "linebreak"
                                },

                                headStyles: {
                                    fontStyle: "bold"
                                },

                                theme: "grid"
                            });

                        }
                    );


                    pdf.save(
                        "excel-to-pdf.pdf"
                    );

                    status.textContent =
                        "Excel converted to PDF successfully!";

                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error converting Excel file. Please check the file and try again.";
                }

            }
        );


        clearBtn.addEventListener(
            "click",
            function () {

                excelFile.value = "";

                status.textContent = "";

            }
        );

    </script>

</body>
</html>
