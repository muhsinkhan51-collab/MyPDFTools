<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Word - MyPDFTools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            background: #f8fafc;
        }

        .upload-area input {
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #convertBtn {
            background: #2563eb;
            color: white;
        }

        #clearBtn {
            background: #64748b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>PDF to Word</h1>
        <p>Convert PDF documents into editable Word files</p>
    </div>

    <div class="container">

        <div class="card">

            <div class="upload-area">

                <h2>Select PDF File</h2>

                <p>
                    Choose a PDF file and convert its text into a Word document.
                </p>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                >

            </div>

            <div class="buttons">

                <button id="convertBtn">
                    Convert to Word
                </button>

                <button id="clearBtn">
                    Clear
                </button>

            </div>

            <div id="status"></div>

            <a href="index.html" class="back">
                ← Back to MyPDFTools
            </a>

        </div>

    </div>


    <!-- JSZip -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>


    <!-- PDF.js -->
    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";


        const pdfFile =
            document.getElementById("pdfFile");

        const convertBtn =
            document.getElementById("convertBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const status =
            document.getElementById("status");


        /*
         * Escape XML characters.
         */

        function escapeXml(text) {

            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;");

        }


        /*
         * Convert PDF text into Word XML.
         */

        function createDocumentXml(paragraphs) {

            let body = "";


            paragraphs.forEach(
                paragraph => {

                    if (!paragraph.trim()) {

                        body +=
                            "<w:p><w:r><w:t></w:t></w:r></w:p>";

                        return;
                    }


                    body +=
                        "<w:p>" +
                        "<w:r>" +
                        "<w:t xml:space=\"preserve\">" +
                        escapeXml(paragraph) +
                        "</w:t>" +
                        "</w:r>" +
                        "</w:p>";

                }
            );


            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<w:document
    xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
    xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">

    <w:body>

        ${body}

        <w:sectPr>

            <w:pgSz
                w:w="11906"
                w:h="16838"/>

            <w:pgMar
                w:top="1440"
                w:right="1440"
                w:bottom="1440"
                w:left="1440"/>

        </w:sectPr>

    </w:body>

</w:document>`;

        }


        /*
         * Create Word styles.
         */

        function createStylesXml() {

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<w:styles
    xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">

    <w:docDefaults>

        <w:rPrDefault>

            <w:rPr>

                <w:rFonts
                    w:ascii="Arial"
                    w:hAnsi="Arial"/>

                <w:sz w:val="22"/>

            </w:rPr>

        </w:rPrDefault>

    </w:docDefaults>

</w:styles>`;

        }


        /*
         * Create document relationships.
         */

        function createDocumentRelsXml() {

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Relationships
    xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

    <Relationship
        Id="rId1"
        Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument"
        Target="word/document.xml"/>

</Relationships>`;

        }


        /*
         * Create main document relationship file.
         */

        function createWordRelsXml() {

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Relationships
    xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

    <Relationship
        Id="rId1"
        Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles"
        Target="styles.xml"/>

</Relationships>`;

        }


        /*
         * Create [Content_Types].xml
         */

        function createContentTypesXml() {

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Types
    xmlns="http://schemas.openxmlformats.org/package/2006/content-types">

    <Default
        Extension="rels"
        ContentType="application/vnd.openxmlformats-package.relationships+xml"/>

    <Default
        Extension="xml"
        ContentType="application/xml"/>

    <Override
        PartName="/word/document.xml"
        ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>

    <Override
        PartName="/word/styles.xml"
        ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>

</Types>`;

        }


        /*
         * Create a complete DOCX file.
         */

        async function createDocx(paragraphs) {

            const zip =
                new JSZip();


            zip.file(
                "[Content_Types].xml",
                createContentTypesXml()
            );


            zip.folder("_rels")
                .file(
                    ".rels",
                    createDocumentRelsXml()
                );


            const word =
                zip.folder("word");


            word.file(
                "document.xml",
                createDocumentXml(paragraphs)
            );


            word.file(
                "styles.xml",
                createStylesXml()
            );


            word.folder("_rels")
                .file(
                    "document.xml.rels",
                    createWordRelsXml()
                );


            return await zip.generateAsync({
                type: "blob",
                mimeType:
                    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            });

        }


        /*
         * Convert PDF to Word.
         */

        convertBtn.addEventListener(
            "click",
            async function () {

                if (!pdfFile.files.length) {

                    status.textContent =
                        "Please select a PDF file.";

                    return;
                }


                try {

                    convertBtn.disabled = true;

                    status.textContent =
                        "Reading PDF...";


                    const file =
                        pdfFile.files[0];


                    const arrayBuffer =
                        await file.arrayBuffer();


                    const pdf =
                        await pdfjsLib.getDocument({
                            data: arrayBuffer
                        }).promise;


                    const allParagraphs = [];


                    /*
                     * Process every PDF page.
                     */

                    for (
                        let pageNumber = 1;
                        pageNumber <= pdf.numPages;
                        pageNumber++
                    ) {

                        status.textContent =
                            "Processing page " +
                            pageNumber +
                            " of " +
                            pdf.numPages +
                            "...";


                        const page =
                            await pdf.getPage(pageNumber);


                        const content =
                            await page.getTextContent();


                        /*
                         * Sort text items by position.
                         */

                        const items =
                            content.items
                                .filter(item =>
                                    item.str &&
                                    item.str.trim() !== ""
                                )
                                .map(item => {

                                    return {
                                        text: item.str,
                                        x: item.transform[4],
                                        y: item.transform[5]
                                    };

                                });


                        items.sort(
                            (a, b) => {

                                if (
                                    Math.abs(a.y - b.y) > 5
                                ) {
                                    return b.y - a.y;
                                }

                                return a.x - b.x;

                            }
                        );


                        /*
                         * Group text into lines.
                         */

                        const lines = [];


                        items.forEach(item => {

                            let line =
                                lines.find(
                                    current =>
                                        Math.abs(
                                            current.y - item.y
                                        ) <= 5
                                );


                            if (!line) {

                                line = {
                                    y: item.y,
                                    items: []
                                };

                                lines.push(line);

                            }


                            line.items.push(item);

                        });


                        lines.sort(
                            (a, b) =>
                                b.y - a.y
                        );


                        /*
                         * Add each line to the Word document.
                         */

                        lines.forEach(line => {

                            line.items.sort(
                                (a, b) =>
                                    a.x - b.x
                            );


                            const text =
                                line.items
                                    .map(
                                        item => item.text
                                    )
                                    .join(" ");


                            allParagraphs.push(
                                text
                            );

                        });


                        /*
                         * Add page break between pages.
                         */

                        if (
                            pageNumber < pdf.numPages
                        ) {

                            allParagraphs.push("");

                            allParagraphs.push(
                                "-------------------- Page " +
                                (pageNumber + 1) +
                                " --------------------"
                            );

                            allParagraphs.push("");

                        }

                    }


                    status.textContent =
                        "Creating Word document...";


                    const docxBlob =
                        await createDocx(
                            allParagraphs
                        );


                    const url =
                        URL.createObjectURL(
                            docxBlob
                        );


                    const link =
                        document.createElement("a");


                    link.href = url;

                    link.download =
                        "pdf-to-word.docx";


                    document.body.appendChild(link);

                    link.click();

                    document.body.removeChild(link);


                    URL.revokeObjectURL(url);


                    status.textContent =
                        "PDF converted to Word successfully!";


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error converting PDF. Please make sure the PDF contains readable text.";

                } finally {

                    convertBtn.disabled = false;

                }

            }
        );


        /*
         * Clear selected file.
         */

        clearBtn.addEventListener(
            "click",
            function () {

                pdfFile.value = "";

                status.textContent = "";

            }
        );

    </script>

</body>
</html>
