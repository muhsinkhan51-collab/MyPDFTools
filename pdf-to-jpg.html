<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to JPG - MyPDFTools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            background: #f8fafc;
        }

        .upload-area input {
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #convertBtn {
            background: #2563eb;
            color: white;
        }

        #clearBtn {
            background: #64748b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>PDF to JPG</h1>
        <p>Convert PDF pages into JPG images</p>
    </div>

    <div class="container">
        <div class="card">

            <div class="upload-area">
                <h2>Select PDF File</h2>
                <p>Choose the PDF you want to convert into JPG images.</p>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                >
            </div>

            <div class="buttons">
                <button id="convertBtn">Convert to JPG</button>
                <button id="clearBtn">Clear</button>
            </div>

            <div id="status"></div>

            <a href="index.html" class="back">
                ← Back to MyPDFTools
            </a>

        </div>
    </div>

    <!-- PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs" type="module"></script>

    <script type="module">

        import * as pdfjsLib from
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

        const pdfFile =
            document.getElementById("pdfFile");

        const convertBtn =
            document.getElementById("convertBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const status =
            document.getElementById("status");

        convertBtn.addEventListener(
            "click",
            async function () {

                if (!pdfFile.files.length) {

                    status.textContent =
                        "Please select a PDF file.";

                    return;
                }

                try {

                    status.textContent =
                        "Converting PDF pages...";

                    const file =
                        pdfFile.files[0];

                    const arrayBuffer =
                        await file.arrayBuffer();

                    const pdf =
                        await pdfjsLib.getDocument({
                            data: arrayBuffer
                        }).promise;

                    for (
                        let pageNumber = 1;
                        pageNumber <= pdf.numPages;
                        pageNumber++
                    ) {

                        const page =
                            await pdf.getPage(pageNumber);

                        const scale = 2;

                        const viewport =
                            page.getViewport({
                                scale: scale
                            });

                        const canvas =
                            document.createElement("canvas");

                        const context =
                            canvas.getContext("2d");

                        canvas.width =
                            viewport.width;

                        canvas.height =
                            viewport.height;

                        await page.render({
                            canvasContext: context,
                            viewport: viewport
                        }).promise;

                        const blob =
                            await new Promise(
                                resolve =>
                                    canvas.toBlob(
                                        resolve,
                                        "image/jpeg",
                                        0.95
                                    )
                            );

                        const url =
                            URL.createObjectURL(blob);

                        const link =
                            document.createElement("a");

                        link.href = url;

                        link.download =
                            `page-${pageNumber}.jpg`;

                        document.body.appendChild(link);

                        link.click();

                        link.remove();

                        URL.revokeObjectURL(url);

                        await new Promise(
                            resolve =>
                                setTimeout(resolve, 150)
                        );
                    }

                    status.textContent =
                        `Successfully converted ${pdf.numPages} page(s) to JPG.`;

                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Error converting PDF. Please try again.";
                }
            }
        );

        clearBtn.addEventListener(
            "click",
            function () {

                pdfFile.value = "";

                status.textContent = "";

            }
        );

    </script>

</body>
</html>
