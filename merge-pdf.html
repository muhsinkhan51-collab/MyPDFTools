<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF - MyPDFTools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .upload-area {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            margin-bottom: 25px;
            background: #f8fafc;
        }

        .upload-area input {
            margin-top: 15px;
        }

        .file-list {
            margin: 20px 0;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .remove-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #mergeBtn {
            background: #2563eb;
            color: white;
        }

        #clearBtn {
            background: #64748b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Merge PDF</h1>
        <p>Combine multiple PDF files into one PDF</p>
    </div>

    <div class="container">
        <div class="card">

            <div class="upload-area">
                <h2>Select PDF Files</h2>
                <p>Choose two or more PDF files to merge.</p>
                <input type="file" id="pdfFiles" accept=".pdf,application/pdf" multiple>
            </div>

            <div id="fileList" class="file-list"></div>

            <div class="buttons">
                <button id="mergeBtn">Merge PDFs</button>
                <button id="clearBtn">Clear</button>
            </div>

            <div id="status"></div>

            <a href="index.html" class="back">← Back to MyPDFTools</a>

        </div>
    </div>

    <!-- PDF-LIB from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <script>
        const pdfFiles = document.getElementById("pdfFiles");
        const fileList = document.getElementById("fileList");
        const mergeBtn = document.getElementById("mergeBtn");
        const clearBtn = document.getElementById("clearBtn");
        const status = document.getElementById("status");

        let selectedFiles = [];

        pdfFiles.addEventListener("change", function () {
            selectedFiles = Array.from(pdfFiles.files);
            displayFiles();
        });

        function displayFiles() {
            fileList.innerHTML = "";

            selectedFiles.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "file-item";

                item.innerHTML = `
                    <span>${index + 1}. ${file.name}</span>
                    <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
                `;

                fileList.appendChild(item);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
        }

        clearBtn.addEventListener("click", function () {
            selectedFiles = [];
            pdfFiles.value = "";
            fileList.innerHTML = "";
            status.textContent = "";
        });

        mergeBtn.addEventListener("click", async function () {

            if (selectedFiles.length < 2) {
                status.textContent = "Please select at least 2 PDF files.";
                return;
            }

            try {
                status.textContent = "Merging PDFs...";

                const mergedPdf = await PDFLib.PDFDocument.create();

                for (const file of selectedFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);

                    const pages = await mergedPdf.copyPages(
                        pdf,
                        pdf.getPageIndices()
                    );

                    pages.forEach(page => {
                        mergedPdf.addPage(page);
                    });
                }

                const mergedBytes = await mergedPdf.save();

                const blob = new Blob([mergedBytes], {
                    type: "application/pdf"
                });

                const url = URL.createObjectURL(blob);

                const link = document.createElement("a");
                link.href = url;
                link.download = "merged.pdf";
                link.click();

                URL.revokeObjectURL(url);

                status.textContent = "PDFs merged successfully!";
            } catch (error) {
                console.error(error);
                status.textContent =
                    "Error merging PDFs. Please check your files.";
            }
        });
    </script>

</body>
</html>
