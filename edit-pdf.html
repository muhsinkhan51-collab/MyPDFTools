<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
}

/* HEADER */

.header {
    height: 64px;
    background: white;
    border-bottom: 1px solid #e5e7eb;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    position: sticky;
    top: 0;

    z-index: 1000;
}

    font-size: 22px;

}

}

.home-link:hover {
    color: #111827;
}


/* TOP BAR */

.topbar {
    background: white;

    border-bottom: 1px solid #e5e7eb;

    padding: 14px 22px;

    display: flex;
    align-items: center;

    gap: 10px;

    position: sticky;

    top: 64px;

    z-index: 900;
}

.top-btn {
    border: 0;

    border-radius: 8px;

    padding: 11px 18px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;
}

.upload-btn {
    background: #111827;

}

.upload-btn:hover {
    background: #000;
}

.save-btn {
    background: #16a34a;

}

    background: #15803d;
}

#fileName {

}


/* EDITOR */

.editor {

}


/* TOOLBAR */

.toolbar {
    width: 285px;

    min-width: 285px;

    background: white;

    border-right: 1px solid #e5e7eb;

    padding: 16px;

    position: sticky;

    top: 119px;

    height: calc(100vh - 119px);

    overflow-y: auto;
}

.tool-section {
    margin-bottom: 18px;
}

.section-title {
    font-size: 12px;

    font-weight: 700;

    color: #6b7280;

    text-transform: uppercase;

    margin-bottom: 8px;

    letter-spacing: .5px;
}

.tool-btn {
    width: 100%;

    border: 1px solid #e5e7eb;

    background: white;

    color: #374151;

    padding: 9px 10px;

    border-radius: 7px;

    cursor: pointer;

    text-align: left;

    margin-bottom: 6px;

    font-size: 13px;
}

.tool-btn:hover {
    background: #f3f4f6;
}

.tool-btn.active {
    background: #111827;

    color: white;

    border-color: #111827;
}


/* CONTROLS */

.control {
    margin-bottom: 10px;
}

.control label {
    display: block;

    font-size: 12px;

    font-weight: 600;

    color: #4b5563;

    margin-bottom: 5px;
}

.control input[type="text"],
.control input[type="number"],
.control select {

    width: 100%;

    border: 1px solid #d1d5db;

    border-radius: 6px;

    padding: 8px;

    background: white;

    font-size: 13px;
}

.control input[type="color"] {

    width: 100%;

    height: 36px;

    padding: 2px;

    border: 1px solid #d1d5db;

    border-radius: 6px;

    cursor: pointer;
}

.control input[type="range"] {
    width: 100%;
}

.checkbox-row {

    display: flex;

    gap: 8px;

    align-items: center;

    margin-bottom: 8px;

    font-size: 13px;

    color: #374151;
}

.checkbox-row input {
    width: auto;
}


/* VIEWER */

.viewer {
    flex: 1;

    min-width: 0;

    padding: 30px;

    overflow-x: auto;
}

#pdfContainer {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 30px;
}

.page-wrapper {

    position: relative;

    background: white;

    box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.pdf-canvas {

    display: block;
}

.draw-canvas {

    position: absolute;

    left: 0;

    top: 0;

    z-index: 5;
}


/* TEXT */

.text-box {

    position: absolute;

    z-index: 20;

    min-width: 40px;

    min-height: 25px;

    padding: 3px 5px;

    border: 1px dashed transparent;

    white-space: pre-wrap;

    word-break: break-word;

    outline: none;

    user-select: text;

    cursor: default;
}

.text-box.selected {

    border: 1px dashed #2563eb;

    cursor: move;
}

.text-box:hover {

    border-color: #93c5fd;
}


/* RESIZE */

.resize-handle {

    display: none;

    position: absolute;

    width: 10px;

    height: 10px;

    right: -5px;

    bottom: -5px;

    background: #2563eb;

    border: 1px solid white;

    border-radius: 2px;

    cursor: nwse-resize;
}

.text-box.selected .resize-handle {
    display: block;
}


/* EMPTY */

.empty-message {

    text-align: center;

    color: #6b7280;

    padding: 100px 20px;

    font-size: 16px;
}

.hidden {
    display: none !important;
}

.status {

    font-size: 12px;

    color: #6b7280;

    margin-top: 8px;

    line-height: 1.4;
}


@media (max-width: 800px) {

    .toolbar {

        width: 230px;

        min-width: 230px;
    }

    .viewer {
        padding: 15px;
    }

    .header {
        padding: 0 15px;
    }

    .topbar {
        padding: 10px;
    }

}

</style>
</head>

<script type="module">


/* =========================================
   PDF.JS
========================================= */

import * as pdfjsLib
from "./node_modules/pdfjs-dist/build/pdf.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"./node_modules/pdfjs-dist/build/pdf.worker.mjs";


const {
    PDFDocument
} = PDFLib;



/* =========================================
   VARIABLES
========================================= */

let pdfBytes = null;

let pdfDocument = null;

let currentTool = "select";

let pages = [];

let selectedTextBox = null;

let dragData = null;

let resizeData = null;



/* =========================================
   ELEMENTS
========================================= */

const pdfInput =
document.getElementById("pdfInput");

const pdfContainer =
document.getElementById("pdfContainer");

const emptyMessage =
document.getElementById("emptyMessage");

const fileName =
document.getElementById("fileName");

const saveBtn =
document.getElementById("saveBtn");

const fontFamily =
document.getElementById("fontFamily");

const fontSize =
document.getElementById("fontSize");

const textColor =
document.getElementById("textColor");

const textTransparency =
document.getElementById("textTransparency");

const textTransparencyValue =
document.getElementById(
    "textTransparencyValue"
);

const textBackground =
document.getElementById("textBackground");

const textBackgroundTransparency =
document.getElementById(
    "textBackgroundTransparency"
);

const textBackgroundTransparencyValue =
document.getElementById(
    "textBackgroundTransparencyValue"
);

const boldText =
document.getElementById("boldText");

const italicText =
document.getElementById("italicText");

const underlineText =
document.getElementById(
    "underlineText"
);

const textAlign =
document.getElementById("textAlign");

const highlightColor =
document.getElementById(
    "highlightColor"
);

const highlightTransparency =
document.getElementById(
    "highlightTransparency"
);

const highlightTransparencyValue =
document.getElementById(
    "highlightTransparencyValue"
);

const highlightThickness =
document.getElementById(
    "highlightThickness"
);

const drawColor =
document.getElementById("drawColor");

const brushSize =
document.getElementById("brushSize");

const undoBtn =
document.getElementById("undoBtn");

const redoBtn =
document.getElementById("redoBtn");

const deleteTextBtn =
document.getElementById(
    "deleteTextBtn"
);

const clearBtn =
document.getElementById("clearBtn");



/* =========================================
   TOOL SELECTION
========================================= */

document
.querySelectorAll(".tool-btn[data-tool]")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".tool-btn[data-tool]"
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            currentTool =
                button.dataset.tool;

            deselectText();

            updateCursor();

        }
    );

});



/* =========================================
   CURSOR
========================================= */

function updateCursor() {

    document
    .querySelectorAll(
        ".page-wrapper"
    )
    .forEach(page => {

        if (
            currentTool === "text"
        ) {

            page.style.cursor =
                "text";

        }

        else if (
            currentTool === "select"
        ) {

            page.style.cursor =
                "default";

        }

        else {

            page.style.cursor =
                "crosshair";

        }

    });

}



/* =========================================
   UPLOAD PDF
========================================= */

pdfInput.addEventListener(
    "change",
    async () => {

        const file =
            pdfInput.files[0];

        if (!file) return;

        pdfBytes =
            await file.arrayBuffer();

        fileName.textContent =
            file.name;

        await renderPDF();

    }
);



/* =========================================
   RENDER PDF
========================================= */

async function renderPDF() {

    pdfContainer.innerHTML = "";

    pages = [];

    selectedTextBox = null;

    emptyMessage.classList.add(
        "hidden"
    );


    pdfDocument =
        await pdfjsLib
        .getDocument({
            data: pdfBytes
        })
        .promise;


    for (
        let pageNumber = 1;
        pageNumber <=
        pdfDocument.numPages;
        pageNumber++
    ) {

        const page =
            await pdfDocument
            .getPage(pageNumber);


        const scale = 1.5;


        const viewport =
            page.getViewport({
                scale
            });


        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "page-wrapper";

        wrapper.dataset.pageNumber =
            pageNumber;


        wrapper.style.width =
            viewport.width + "px";

        wrapper.style.height =
            viewport.height + "px";



        /* PDF CANVAS */

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.className =
            "pdf-canvas";

        canvas.width =
            viewport.width;

        canvas.height =
            viewport.height;

        canvas.style.width =
            viewport.width + "px";

        canvas.style.height =
            viewport.height + "px";


        wrapper.appendChild(canvas);


        const ctx =
            canvas.getContext("2d");


        await page.render({

            canvasContext: ctx,

            viewport

        }).promise;



        /* DRAW CANVAS */

        const drawCanvas =
            document.createElement(
                "canvas"
            );

        drawCanvas.className =
            "draw-canvas";

        drawCanvas.width =
            viewport.width;

        drawCanvas.height =
            viewport.height;

        drawCanvas.style.width =
            viewport.width + "px";

        drawCanvas.style.height =
            viewport.height + "px";


        wrapper.appendChild(
            drawCanvas
        );


        const pageData = {

            pageNumber,

            wrapper,

            canvas,

            drawCanvas,

            ctx:
                drawCanvas.getContext(
                    "2d"
                ),

            textBoxes: [],

            history: [],

            redoHistory: [],

            drawing: false,

            startX: 0,

            startY: 0,

            lastX: 0,

            lastY: 0

        };


        pages.push(pageData);

        pdfContainer.appendChild(
            wrapper
        );


        setupCanvasEvents(
            pageData
        );

        setupPageEvents(
            pageData
        );

    }


    updateCursor();

}



/* =========================================
   GET PAGE
========================================= */

function getPageData(element) {

    const wrapper =
        element.closest(
            ".page-wrapper"
        );

    if (!wrapper) return null;


    const pageNumber =
        Number(
            wrapper.dataset.pageNumber
        );


    return pages[
        pageNumber - 1
    ];

}



/* =========================================
   PAGE EVENTS
========================================= */

function setupPageEvents(
    pageData
) {

    const wrapper =
        pageData.wrapper;


    wrapper.addEventListener(
        "mousedown",
        event => {

            if (
                currentTool ===
                "text"
            ) {

                if (
                    event.target ===
                    wrapper ||

                    event.target
                    .classList
                    .contains(
                        "pdf-canvas"
                    ) ||

                    event.target
                    .classList
                    .contains(
                        "draw-canvas"
                    )
                ) {

                    addTextBox(
                        pageData,
                        event.offsetX,
                        event.offsetY
                    );

                }

            }

        }
    );

}



/* =========================================
   ADD TEXT
========================================= */

function addTextBox(
    pageData,
    x,
    y
) {

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "text-box";


    box.contentEditable =
        true;


    box.spellcheck =
        false;


    box.innerText =
        "Type text";


    box.style.left =
        x + "px";

    box.style.top =
        y + "px";


    applyTextStyle(
        box
    );


    box.dataset.page =
        pageData.pageNumber;



    /* RESIZE */

    const handle =
        document.createElement(
            "div"
        );

    handle.className =
        "resize-handle";


    box.appendChild(
        handle
    );


    pageData.wrapper.appendChild(
        box
    );


    pageData.textBoxes.push(
        box
    );


    selectTextBox(
        box
    );


    currentTool =
        "select";


    document
    .querySelectorAll(
        ".tool-btn[data-tool]"
    )
    .forEach(btn =>
        btn.classList.remove(
            "active"
        )
    );


    document
    .querySelector(
        '[data-tool="select"]'
    )
    .classList.add(
        "active"
    );


    box.addEventListener(
        "focus",
        () => {

            if (
                box.innerText
                .trim() ===
                "Type text"
            ) {

                box.innerText = "";

            }

        },
        {
            once: true
        }
    );


    box.addEventListener(
        "mousedown",
        textMouseDown
    );


    handle.addEventListener(
        "mousedown",
        resizeMouseDown
    );


    box.focus();

    placeCaretAtEnd(
        box
    );

}



/* =========================================
   APPLY TEXT STYLE
========================================= */

function applyTextStyle(
    box
) {

    box.style.fontFamily =
        fontFamily.value;

    box.style.fontSize =
        fontSize.value + "px";


    box.style.color =
        colorWithTransparency(
            textColor.value,
            Number(
                textTransparency.value
            )
        );


    box.style.backgroundColor =
        colorWithTransparency(
            textBackground.value,
            Number(
                textBackgroundTransparency.value
            )
        );


    box.style.fontWeight =
        boldText.checked
        ? "700"
        : "400";


    box.style.fontStyle =
        italicText.checked
        ? "italic"
        : "normal";


    box.style.textDecoration =
        underlineText.checked
        ? "underline"
        : "none";


    box.style.textAlign =
        textAlign.value;

}



/* =========================================
   PLACE CARET
========================================= */

function placeCaretAtEnd(
    element
) {

    const range =
        document.createRange();

    const selection =
        window.getSelection();


    range.selectNodeContents(
        element
    );

    range.collapse(false);


    selection.removeAllRanges();

    selection.addRange(
        range
    );

}



/* =========================================
   SELECT TEXT
========================================= */

function selectTextBox(
    box
) {

    document
    .querySelectorAll(
        ".text-box"
    )
    .forEach(item => {

        item.classList.remove(
            "selected"

}

function textMouseDown(

        )
    ) {

            );

        dragData = {

            box,

            page,

            offsetX:
                event.clientX -
                rect.left,

                event.clientY -

        };


        document.addEventListener(

        );

/* =========================================
   MOVE TEXT
========================================= */

function moveText(
    event
) {

    if (!dragData) return;


    const {
        box,
        page,
        offsetX,
        offsetY
    } = dragData;


    const pageRect =
        page.wrapper
        .getBoundingClientRect();


    let x =
        event.clientX -
        pageRect.left -
        offsetX;


    let y =
        event.clientY -
        pageRect.top -
        offsetY;


    const maxX =
        page.wrapper.clientWidth -
        box.offsetWidth;


    const maxY =
        page.wrapper.clientHeight -
        box.offsetHeight;


    x = Math.max(
        0,
        Math.min(
            x,
            maxX
        )
    );


    y = Math.max(
        0,
        Math.min(
            y,
            maxY
        )
    );


    box.style.left =
        x + "px";


    box.style.top =
        y + "px";

}



/* =========================================
   STOP MOVE

function stopMoveText() {

    document.removeEventListener(

/* =========================================
   CANVAS EVENTS
========================================= */

function setupCanvasEvents(
    pageData
) {

    const canvas =
        pageData.drawCanvas;


    canvas.addEventListener(
        "mousedown",
        startDrawing
    );


    canvas.addEventListener(
        "mousemove",
        drawMove
    );


    canvas.addEventListener(
        "mouseup",
        stopDrawing
    );


    canvas.addEventListener(
        "mouseleave",
        stopDrawing
    );


    function getPosition(
        event
    ) {

        const rect =
            canvas.getBoundingClientRect();


        return {

            x:
                event.clientX -
                rect.left,

            y:
                event.clientY -
                rect.top

        };

    }


    function startDrawing(
        event
    ) {

        if (
            currentTool ===
            "select" ||

            currentTool ===
            "text"
        ) {

            return;

        }


        pageData.drawing =
            true;


        const pos =
            getPosition(
                event
            );


        pageData.startX =
            pos.x;

        pageData.startY =
            pos.y;

        pageData.lastX =
            pos.x;

        pageData.lastY =
            pos.y;


        saveCanvasState(
            pageData
        );

    }



    function drawMove(
        event
    ) {

        if (
            !pageData.drawing
        ) return;


        const pos =
            getPosition(
                event
            );


        const ctx =
            pageData.ctx;


        if (

            currentTool === "draw" ||

            currentTool === "eraser" ||

            currentTool === "whiteout" ||

            currentTool === "highlight"

        ) {


            let color =
                drawColor.value;


            let width =
                Number(
                    brushSize.value
                );


            let alpha = 1;


            if (
                currentTool ===
                "eraser"
            ) {

                ctx.globalCompositeOperation =
                    "destination-out";

            }

            else if (
                currentTool ===
                "whiteout"
            ) {

                ctx.globalCompositeOperation =
                    "source-over";

                color =
                    "#ffffff";

            }

            else if (
                currentTool ===
                "highlight"
            ) {

                ctx.globalCompositeOperation =
                    "source-over";

                color =
                    highlightColor.value;

                width =
                    Number(
                        highlightThickness.value
                    );

                alpha =
                    1 -
                    Number(
                        highlightTransparency.value
                    ) / 100;

            }

            else {

                ctx.globalCompositeOperation =
                    "source-over";

            }


            ctx.strokeStyle =
                color;


            ctx.globalAlpha =
                alpha;


            ctx.lineWidth =
                width;


            ctx.lineCap =
                "round";


            ctx.lineJoin =
                "round";


            ctx.beginPath();


            ctx.moveTo(
                pageData.lastX,
                pageData.lastY
            );


            ctx.lineTo(
                pos.x,
                pos.y
            );


            ctx.stroke();


            pageData.lastX =
                pos.x;


            pageData.lastY =
                pos.y;


            ctx.globalAlpha =
                1;


            return;

        }



        /* SHAPES */

        if (

            currentTool === "line" ||

            currentTool === "arrow" ||

            currentTool === "rectangle" ||

            currentTool === "circle"

        ) {

            redrawFromLastState(
                pageData
            );


            const ctx =
                pageData.ctx;


            ctx.globalCompositeOperation =
                "source-over";


            ctx.strokeStyle =
                drawColor.value;


            ctx.lineWidth =
                Number(
                    brushSize.value
                );


            ctx.globalAlpha =
                1;


            const x =
                pos.x;

            const y =
                pos.y;


            const sx =
                pageData.startX;

            const sy =
                pageData.startY;


            if (
                currentTool ===
                "line"
            ) {

                drawLine(
                    ctx,
                    sx,
                    sy,
                    x,
                    y
                );

            }


            if (
                currentTool ===
                "arrow"
            ) {

                drawArrow(
                    ctx,
                    sx,
                    sy,
                    x,
                    y
                );

            }


            if (
                currentTool ===
                "rectangle"
            ) {

                ctx.strokeRect(
                    sx,
                    sy,
                    x - sx,
                    y - sy
                );

            }


            if (
                currentTool ===
                "circle"
            ) {

                const radius =
                    Math.sqrt(
                        Math.pow(
                            x - sx,
                            2
                        ) +
                        Math.pow(
                            y - sy,
                            2
                        )
                    );


                ctx.beginPath();


                ctx.arc(
                    sx,
                    sy,
                    radius,
                    0,
                    Math.PI * 2
                );


                ctx.stroke();

            }

        }

    }



    function stopDrawing() {

        if (
            !pageData.drawing
        ) return;


        pageData.drawing =
            false;


        pageData.ctx.globalAlpha =
            1;


        pageData.ctx.globalCompositeOperation =
            "source-over";

    }

}



/* =========================================
   LINE
========================================= */

function drawLine(
    ctx,
    x1,
    y1,
    x2,
    y2
) {

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();

}



/* =========================================
   ARROW
========================================= */

function drawArrow(
    ctx,
    x1,
    y1,
    x2,
    y2
) {

    const angle =
        Math.atan2(
            y2 - y1,
            x2 - x1
        );


    const headLength =
        12;


    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(
        x2,
        y2
    );


    ctx.lineTo(

        x2 -
        headLength *
        Math.cos(
            angle -
            Math.PI / 6
        ),

        y2 -
        headLength *
        Math.sin(
            angle -
            Math.PI / 6
        )

    );


    ctx.moveTo(
        x2,
        y2
    );


    ctx.lineTo(

        x2 -
        headLength *
        Math.cos(
            angle +
            Math.PI / 6
        ),

        y2 -
        headLength *
        Math.sin(
            angle +
            Math.PI / 6
        )

    );


    ctx.stroke();

}



/* =========================================
   HISTORY
========================================= */

function saveCanvasState(
    pageData
) {

    pageData.history.push(

        pageData.ctx.getImageData(
            0,
            0,
            pageData.drawCanvas.width,
            pageData.drawCanvas.height
        )

    );


    if (
        pageData.history.length >
        30
    ) {

        pageData.history.shift();

    }


    pageData.redoHistory = [];

}



/* =========================================
   REDRAW
========================================= */

function redrawFromLastState(
    pageData
) {

    const ctx =
        pageData.ctx;


    if (
        pageData.history.length === 0
    ) {

        ctx.clearRect(
            0,
            0,
            pageData.drawCanvas.width,
            pageData.drawCanvas.height
        );

        return;

    }


    const state =
        pageData.history[
            pageData.history.length - 1
        ];


    ctx.putImageData(
        state,
        0,
        0
    );

}

/* =========================================
   CREATE PAGE IMAGE
   THIS IS THE IMPORTANT FONT FIX
========================================= */

async function createEditedPageImage(
    pageData
) {

    /*
       Create a temporary canvas
       containing:

       1. Original PDF page
       2. Drawings
       3. Actual browser-rendered text

       Because the text is rendered by
       the browser, the selected font
       appearance is preserved.
    */


    const width =
        pageData.canvas.width;


    const height =
        pageData.canvas.height;


    const output =
        document.createElement(
            "canvas"
        );


    output.width =
        width;

    output.height =
        height;


    const ctx =
        output.getContext(
            "2d"
        );


    /* ORIGINAL PDF */

    ctx.drawImage(
        pageData.canvas,
        0,
        0
    );


    /* DRAWINGS */

    ctx.drawImage(
        pageData.drawCanvas,
        0,
        0
    );


    /*
       Render every text box
       using browser Canvas.
    */

    for (
        const box of pageData.textBoxes
    ) {

        const text =
            box.innerText
            .replace(
                /\nresize$/i,
                ""
            );


        if (
            !text.trim()
        ) {

            continue;

        }


        const style =
            getComputedStyle(
                box
            );


        const x =
            parseFloat(
                box.style.left
            );


        const y =
            parseFloat(
                box.style.top
            );


        const boxWidth =
            box.offsetWidth;


        const boxHeight =
            box.offsetHeight;


        /* BACKGROUND */

        const bg =
            parseRGBA(
                style.backgroundColor
            );


        if (
            bg &&
            bg.alpha > 0
        ) {

            ctx.save();


            ctx.fillStyle =
                `rgba(
                    ${bg.r},
                    ${bg.g},
                    ${bg.b},
                    ${bg.alpha}
                )`;


            ctx.fillRect(
                x,
                y,
                boxWidth,
                boxHeight
            );


            ctx.restore();

        }



        /* TEXT */

        const textColorData =
            parseRGBA(
                style.color
            );


        ctx.save();


        ctx.fillStyle =
            `rgba(
                ${textColorData.r},
                ${textColorData.g},
                ${textColorData.b},
                ${textColorData.alpha}
            )`;


        /*
           IMPORTANT:
           Use the exact browser
           font family selected by user.
        */

        let fontStyle =
            "";


        if (
            style.fontStyle ===
            "italic"
        ) {

            fontStyle +=
                "italic ";

        }


        let fontWeight =
            style.fontWeight;


        ctx.font =
            `${fontStyle}${fontWeight} ${style.fontSize} ${style.fontFamily}`;


        ctx.textAlign =
            style.textAlign;


        ctx.textBaseline =
            "top";


        const lineHeight =
            parseFloat(
                style.lineHeight
            ) ||
            parseFloat(
                style.fontSize
            ) * 1.2;


        const lines =
            text.split("\n");


        let drawX;


        if (
            style.textAlign ===
            "center"
        ) {

            drawX =
                x +
                boxWidth / 2;

        }

        else if (
            style.textAlign ===
            "right"
        ) {

            drawX =
                x +
                boxWidth;

        }

        else {

            drawX =
                x +
                parseFloat(
                    style.paddingLeft
                );

        }


        lines.forEach(
            (
                line,
                index
            ) => {

                const drawY =
                    y +
                    parseFloat(
                        style.paddingTop
                    ) +
                    index *
                    lineHeight;


                ctx.fillText(
                    line,
                    drawX,
                    drawY
                );


                /* UNDERLINE */

                if (
                    style.textDecoration
                    .includes(
                        "underline"
                    )
                ) {

                    const metrics =
                        ctx.measureText(
                            line
                        );


                    let underlineX =
                        drawX;


                    if (
                        style.textAlign ===
                        "center"
                    ) {

                        underlineX =
                            drawX -
                            metrics.width / 2;

                    }

                    else if (
                        style.textAlign ===
                        "right"
                    ) {

                        underlineX =
                            drawX -
                            metrics.width;

                    }


                    ctx.beginPath();


                    ctx.lineWidth =
                        Math.max(
                            1,
                            parseFloat(
                                style.fontSize
                            ) / 15
                        );


                    ctx.moveTo(
                        underlineX,
                        drawY +
                        parseFloat(
                            style.fontSize
                        )
                    );


                    ctx.lineTo(
                        underlineX +
                        metrics.width,
                        drawY +
                        parseFloat(
                            style.fontSize
                        )
                    );


                    ctx.strokeStyle =
                        `rgba(
                            ${textColorData.r},
                            ${textColorData.g},
                            ${textColorData.b},
                            ${textColorData.alpha}
                        )`;


                    ctx.stroke();

                }

            }
        );


        ctx.restore();

    }


    return output.toDataURL(
        "image/png"
    );

}



/* =========================================
   SAVE PDF
========================================= */

saveBtn.addEventListener(
    "click",
    async () => {

        if (!pdfBytes) {

            alert(
                "Please upload a PDF first."
            );

            return;

        }


        saveBtn.disabled =
            true;


        saveBtn.textContent =
            "Saving...";


        try {


            const pdf =
                await PDFDocument.load(
                    pdfBytes
                );


            /*
               IMPORTANT:

               We now render the whole
               edited page to PNG.

               This preserves the actual
               browser font selected by user.
            */


            for (
                let i = 0;
                i < pages.length;
                i++
            ) {


                const pageData =
                    pages[i];


                const pdfPage =
                    pdf.getPage(i);


                const imageData =
                    await createEditedPageImage(
                        pageData
                    );


                const png =
                    await pdf.embedPng(
                        imageData
                    );


                const pdfWidth =
                    pdfPage.getWidth();


                const pdfHeight =
                    pdfPage.getHeight();


                pdfPage.drawImage(
                    png,
                    {

                        x: 0,

                        y: 0,

                        width:
                            pdfWidth,

                        height:
                            pdfHeight

                    }
                );

            }


            const finalBytes =
                await pdf.save();


            const blob =
                new Blob(
                    [finalBytes],
                    {
                        type:
                            "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "edited.pdf";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );


        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "Could not save the PDF. Please try again."
            );

        }


        saveBtn.disabled =
            false;


        saveBtn.textContent =
            "Save PDF";

    }
);



/* =========================================
   PARSE RGBA
========================================= */

function parseRGBA(
    value
) {

    if (!value) {

        return {

            r: 0,

            g: 0,

            b: 0,

            alpha: 0

        };

    }


    const match =
        value.match(
            /rgba?\(([^)]+)\)/
        );


    if (!match) {

        return {

            r: 0,

            g: 0,

            b: 0,

            alpha: 0

        };

    }


    const parts =
        match[1]
        .split(",")
        .map(
            x => x.trim()
        );


    return {

        r:
            Number(parts[0]),

        g:
            Number(parts[1]),

        b:
            Number(parts[2]),

        alpha:
            parts[3] !== undefined
            ? Number(parts[3])
            : 1

    };

}
